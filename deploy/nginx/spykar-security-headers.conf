# Security headers for spykarlifestyles.info — installed to /etc/nginx/snippets/.
# Included at server level AND in every location that has its own add_header:
# nginx drops ALL inherited add_header directives in a block that defines any.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
