# ─── Spykar IQ — https://spykarlifestyles.info ───────────────────────────────
# nginx terminates TLS and routes:  /api/  → API  (127.0.0.1:4000)
#                                   /      → web  (127.0.0.1:3000, Next.js)
# Certificates: /etc/nginx/ssl/spykarlifestyles.info/ (installed by
# deploy/golive_nginx.sh from spykar-ssl/, which is git-ignored).

upstream spykar_api { server 127.0.0.1:4000; keepalive 32; }
upstream spykar_web { server 127.0.0.1:3000; keepalive 32; }

# http → https (apex and www)
server {
    listen 80;
    listen [::]:80;
    server_name spykarlifestyles.info www.spykarlifestyles.info;
    return 301 https://spykarlifestyles.info$request_uri;
}

# www → apex (one canonical origin: cookies, CORS and bookmarks stay simple)
server {
    listen 443 ssl http2;          # nginx 1.24 syntax (Ubuntu 24.04); 'http2 on' needs ≥1.25.1
    listen [::]:443 ssl http2;
    server_name www.spykarlifestyles.info;
    ssl_certificate     /etc/nginx/ssl/spykarlifestyles.info/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/spykarlifestyles.info/privkey.pem;
    return 301 https://spykarlifestyles.info$request_uri;
}

server {
    listen 443 ssl http2;          # nginx 1.24 syntax (Ubuntu 24.04); 'http2 on' needs ≥1.25.1
    listen [::]:443 ssl http2;
    server_name spykarlifestyles.info;

    # ── TLS ─────────────────────────────────────────────────────────────────
    ssl_certificate         /etc/nginx/ssl/spykarlifestyles.info/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/spykarlifestyles.info/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/spykarlifestyles.info/fullchain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:spykar_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security headers: nginx is the ONE authority for these. The API's
    # helmet sends its own (different HSTS) — hide them so every response
    # carries exactly one, consistent set.
    include /etc/nginx/snippets/spykar-security-headers.conf;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Powered-By;

    # ── Request hygiene ─────────────────────────────────────────────────────
    client_max_body_size   10m;     # = express.json limit
    client_header_timeout  15s;
    client_body_timeout    15s;
    send_timeout           60s;
    keepalive_timeout      65s;
    server_tokens off;
    limit_conn spk_conn 200;

    # Edge 429s answer in the API's own JSON shape.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        include /etc/nginx/snippets/spykar-security-headers.conf;   # add_header here drops inherited ones
        add_header Retry-After 5 always;
        return 429 '{"success":false,"code":"RATE_LIMITED","message":"Too many requests. Please slow down.","retryAfter":5}';
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # OVERWRITE (never append): nginx is the only edge, so the client cannot
    # inject a fake IP to get a fresh rate-limit bucket in the API.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # ── Login: strict per-IP brake before Node (the API also locks per account)
    location = /api/v1/auth/login {
        limit_req zone=spk_login burst=30 nodelay;
        proxy_pass http://spykar_api;
    }

    # ── API ────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=spk_api burst=1000 nodelay;
        proxy_read_timeout 65s;     # API caps requests at 45 s
        proxy_send_timeout 65s;
        proxy_pass http://spykar_api;
    }

    # API health for uptime monitors (not under /api)
    location = /health { proxy_pass http://spykar_api; }

    # ── Next.js static assets: never rate-limited. Next already sends
    # Cache-Control: public, max-age=31536000, immutable — no add_header here,
    # so the server-level security headers are inherited.
    location /_next/static/ {
        proxy_pass http://spykar_web;
    }

    # ── App pages ─────────────────────────────────────────────────────────
    location / {
        limit_req zone=spk_web burst=500 nodelay;
        proxy_pass http://spykar_web;
    }
}
