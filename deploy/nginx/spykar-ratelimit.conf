# ─── Spykar IQ — edge rate limiting (http context: /etc/nginx/conf.d/) ─────────
# Layer 1 of 2. A per-IP flood shield that runs before Node. Deliberately
# generous: a whole office shares one public IP and a dashboard page fires
# ~25 API calls at once. Business limits (per signed-in user) live in the API:
# spykar-backend/src/middleware/rateLimits.js.

limit_req_zone  $binary_remote_addr zone=spk_api:20m   rate=100r/s;
limit_req_zone  $binary_remote_addr zone=spk_web:20m   rate=100r/s;
limit_req_zone  $binary_remote_addr zone=spk_login:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=spk_conn:10m;

limit_req_status  429;
limit_conn_status 429;
limit_req_log_level  warn;
limit_conn_log_level warn;
